<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign in — OfficePulse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/login.css">
 
</head>
<body>

<header class="masthead">
  <div class="wordmark"><span class="dot"></span>OfficePulse<small>attendance, timestamped</small></div>
</header>

<main>
  <div class="auth-ticket">
    <h1 class="auth-title">Sign in</h1>
    <p class="auth-sub">Clock in and check your attendance history.</p>

    <div class="form-banner" id="form-banner"></div>

    <form id="login-form" novalidate>
      <div class="field">
        <label for="email">Work email</label>
        <input type="email" id="email" name="email" autocomplete="email" placeholder="you@company.com" required>
        <div class="error-msg" id="email-error"></div>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" placeholder="••••••••" required>
        <div class="error-msg" id="password-error"></div>
      </div>

      <div class="field-row">
        <label class="checkbox">
          <input type="checkbox" id="remember" name="remember">
          Keep me signed in
        </label>
        <a href="#" id="forgot-link">Forgot password?</a>
      </div>

      <button type="submit" class="submit-btn" id="submit-btn">Sign in</button>
    </form>

    <p class="auth-switch">New here? <a href="signup.html">Create an account</a></p>
  </div>
</main>
<script src="../js/login.js"></script>
</body>
</html>
